<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduGenie | Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#f8f3ff);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:1000px;
    min-height:600px;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(70,90,150,.15);
}

/* LEFT SIDE */

.left{
    padding:55px;
    background:linear-gradient(145deg,#6685e8,#8b75df);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    font-size:28px;
    font-weight:800;
    margin-bottom:45px;
}

.left h1{
    font-size:40px;
    line-height:1.2;
    margin-bottom:18px;
}

.left p{
    font-size:16px;
    line-height:1.7;
    opacity:.9;
}

.features{
    margin-top:35px;
}

.feature{
    display:flex;
    gap:12px;
    align-items:center;
    margin:18px 0;
}

.feature-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.18);
    border-radius:13px;
}

/* RIGHT SIDE */

.right{
    padding:55px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right h2{
    font-size:32px;
    color:#26324a;
    margin-bottom:8px;
}

.subtitle{
    color:#858da0;
    margin-bottom:28px;
}

/* TABS */

.tabs{
    display:flex;
    gap:10px;
    background:#f1f3fa;
    padding:5px;
    border-radius:15px;
    margin-bottom:25px;
}

.tab{
    flex:1;
    border:none;
    padding:11px;
    border-radius:11px;
    background:transparent;
    cursor:pointer;
    font-weight:600;
    color:#747d91;
}

.tab.active{
    background:white;
    color:#5574d9;
    box-shadow:0 3px 10px rgba(70,90,150,.08);
}

/* FORM */

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    margin-bottom:7px;
    color:#4d5870;
    font-size:14px;
    font-weight:600;
}

.input{
    width:100%;
    padding:14px 16px;
    border:1px solid #e1e5ef;
    border-radius:13px;
    outline:none;
    margin-bottom:18px;
    font-size:14px;
}

.input:focus{
    border-color:#6685e8;
}

.main-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:14px;
    background:linear-gradient(135deg,#6685e8,#8b75df);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:5px;
}

.main-btn:hover{
    transform:translateY(-2px);
}

.forgot{
    text-align:right;
    margin-bottom:10px;
}

.forgot a{
    color:#6685e8;
    font-size:13px;
    text-decoration:none;
}

.note{
    text-align:center;
    margin-top:18px;
    color:#9299aa;
    font-size:12px;
}

/* MOBILE */

@media(max-width:750px){

    .container{
        grid-template-columns:1fr;
    }

    .left{
        display:none;
    }

    .right{
        padding:35px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->

    <div class="left">

        <div class="logo">
            🎓 EduGenie
        </div>

        <h1>
            Learn Smarter.<br>
            Grow Faster. 🚀
        </h1>

        <p>
            Your personal AI-powered learning assistant
            for smarter and faster education.
        </p>

        <div class="features">

            <div class="feature">
                <div class="feature-icon">🤖</div>
                <span>AI-powered learning</span>
            </div>

            <div class="feature">
                <div class="feature-icon">🧠</div>
                <span>Smart quizzes</span>
            </div>

            <div class="feature">
                <div class="feature-icon">📊</div>
                <span>Track your progress</span>
            </div>

        </div>

    </div>


    <!-- RIGHT -->

    <div class="right">

        <h2 id="title">
            Welcome Back 👋
        </h2>

        <p class="subtitle" id="subtitle">
            Login to continue your learning journey.
        </p>


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="showLogin()">
                Login
            </button>

            <button
                class="tab"
                id="registerTab"
                onclick="showRegister()">
                Register
            </button>

        </div>


        <!-- LOGIN FORM -->

        <form
            class="form active"
            id="loginForm"
            onsubmit="login(event)">

            <label>Email Address</label>

            <input
                class="input"
                type="email"
                placeholder="Enter your email"
                required>


            <label>Password</label>

            <input
                class="input"
                type="password"
                placeholder="Enter your password"
                required>


            <div class="forgot">
                <a href="#">Forgot password?</a>
            </div>


            <button class="main-btn" type="submit">
                Login to EduGenie →
            </button>

        </form>


        <!-- REGISTER FORM -->

        <form
            class="form"
            id="registerForm"
            onsubmit="register(event)">

            <label>Full Name</label>

            <input
                class="input"
                type="text"
                placeholder="Enter your name"
                required>


            <label>Email Address</label>

            <input
                class="input"
                type="email"
                placeholder="Enter your email"
                required>


            <label>Password</label>

            <input
                class="input"
                type="password"
                placeholder="Create a password"
                required>


            <button class="main-btn" type="submit">
                Create Account →
            </button>

        </form>


        <p class="note">
            🔒 Your learning journey starts here.
        </p>

    </div>

</div>



    <script>

function showLogin(){

    document.getElementById("loginForm").classList.add("active");
    document.getElementById("registerForm").classList.remove("active");

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("registerTab").classList.remove("active");

    document.getElementById("title").textContent = "Welcome Back 👋";

    document.getElementById("subtitle").textContent =
        "Login to continue your learning journey.";
}


function showRegister(){

    document.getElementById("registerForm").classList.add("active");
    document.getElementById("loginForm").classList.remove("active");

    document.getElementById("registerTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");

    document.getElementById("title").textContent = "Create Account ✨";

    document.getElementById("subtitle").textContent =
        "Join EduGenie and start learning smarter.";
}


/* LOGIN */

async function login(event){

    event.preventDefault();

    const email = document.querySelector("#loginForm input[type='email']").value;
    const password = document.querySelector("#loginForm input[type='password']").value;

    try {

        const response = await fetch("http://127.0.0.1:5000/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if(data.success){

            alert("Welcome back, " + data.name + "! 🎉");

            window.location.href = "dashboard.html";

        }
        else{

            alert(data.message);

        }

    }
    catch(error){

        alert("Backend connection failed! 😭");

        console.error(error);

    }
}


/* REGISTER */

async function register(event){

    event.preventDefault();

    const name = document.querySelector("#registerForm input[type='text']").value;
    const email = document.querySelector("#registerForm input[type='email']").value;
    const password = document.querySelector("#registerForm input[type='password']").value;

    try {

        const response = await fetch("http://127.0.0.1:5000/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if(data.success){

            alert("Account created successfully! 🎉");

            showLogin();

        }
        else{

            alert(data.message);

        }

    }
    catch(error){

        alert("Backend connection failed! 😭");

        console.error(error);

    }
}

</script>

</body>
</html>
